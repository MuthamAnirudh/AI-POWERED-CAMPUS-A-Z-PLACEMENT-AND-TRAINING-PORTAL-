  <!-- Resource hints — fixes the noticeable lag right after scanning a Gate Pass QR code.
       Scanning opens this page fresh (no warm cache), and it was previously paying the full
       DNS + TLS handshake cost for every CDN (unpkg, jsDelivr, cdnjs, the QR image fallback
       hosts) one at a time, in series, as each <script>/<img> tag was reached. Preconnecting
       (DNS + TLS ahead of time) and dns-prefetching the QR fallback image hosts lets the
       browser do all of that connection setup in parallel, in the background, starting the
       instant the page is requested — well before the scripts/images that need it are parsed. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <!-- Tailwind compatibility shim. Production styling is already compiled into tailwind-static.css;
       this local file only provides window.tailwind for the existing configuration code. -->
  <script src="./vendor/tailwindcss-browser.js" data-runtime-key="tailwind"></script>
  <script>
    // Waits for `window.tailwind` before touching it, instead of assuming the script tag
    // above has already finished loading by the time this runs. Fixes:
    // "Uncaught ReferenceError: tailwind is not defined" — which happened whenever the
    // Tailwind CDN was slow, blocked, or (rarely) still mid-download on a slow connection
    // when this config script executed right after it.
    (function applyTailwindConfig() {
      if (typeof window.tailwind === 'undefined') {
        setTimeout(applyTailwindConfig, 30);
        return;
      }
      tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              300: '#7cc8fc',
              400: '#36adfa',
              500: '#0c8ee9',
              600: '#0270c7',
              700: '#0359a1',
              800: '#074c83',
              900: '#0c406e',
              950: '#082849',
            }
          },
          animation: {
            'marquee': 'marquee 25s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
      };
    })();
  </script>
  
  <!-- React & ReactDOM runtime — REQUIRED same-origin production assets.
       These files are committed under frontend/vendor and are loaded synchronously before the
       precompiled application. There is intentionally NO unpkg/cdnjs fallback for React or
       ReactDOM: if either file is absent from the deployment artifact, the deployment is broken
       and must fail/diagnose locally instead of depending on a third-party CDN. -->
  <script crossorigin src="./vendor/react.production.min.js" data-runtime-key="react"></script>
  <script src="./vendor/react-runtime-ensure.js"></script>
  <script crossorigin src="./vendor/react-dom.production.min.js" data-runtime-key="react-dom"></script>
  <script src="./vendor/react-dom-runtime-ensure.js"></script>
  <!-- Babel Standalone is no longer loaded: the app script below is precompiled plain JS, so the
       in-browser JSX transpile step (and this CDN dependency) has been removed entirely. -->

  <!-- Optional cross-device Gate Pass URL. This file is intentionally tiny and contains no secrets. -->
  <script src="./gate-pass-public-config.js"></script>

  <!-- pptxgenjs — powers the Text-to-PPT Converter (client-side .pptx generation, no server).
       NOTE: cdnjs does not actually host this package, so that URL 404s and PptxGenJS never
       loads (this was the cause of "PPT engine failed to load"). jsDelivr (backed by the
       project's own npm publish + GitHub releases) is the officially recommended CDN — used
       here with an automatic fallback mirror in case one host is unreachable. -->
  <script defer src="./vendor/pptxgen.bundle.js" data-runtime-key="pptx"></script>

  <!-- EmailJS — powers the "Forgot Password" account-recovery flow by emailing a one-time
       verification code to the user's Gmail. Optional: if an admin hasn't configured an EmailJS
       Service ID / Template ID / Public Key (Admin → AI & Integrations), the app falls back to
       showing the code on-screen in a clearly-labeled "demo mode" so recovery still works
       end-to-end while testing, without silently failing. -->
  <script defer src="./vendor/email.min.js" data-runtime-key="emailjs"></script>

  <!-- jsPDF + html2canvas — power the "Export to PDF" option on the PPT generator (renders each
       slide's on-screen preview to a page image, alongside the native .pptx export). -->
  <script defer src="./vendor/html2canvas.min.js" data-runtime-key="html2canvas"></script>
  <script defer src="./vendor/jspdf.umd.min.js" data-runtime-key="jspdf"></script>
  <!-- QRCode.js — generates the one-time Gate Pass QR codes (client-side, no network call).
       If the primary CDN (jsDelivr) is blocked on this network, fall back to the unpkg mirror
       — same pattern used for the Face ID model loader below, since a blocked/ad-blocked CDN
       was the actual root cause of "QR not generating" (the canvas silently stayed blank with
       no error shown). The GatePassQR component further below adds a visible retry + fallback
       UI on top of this, for the case where BOTH CDNs are blocked. -->
  <script defer src="./vendor/qrcode.min.js" data-runtime-key="qrcode"></script>

  <!-- @vladmandic/face-api — actively-maintained, upgraded successor to the abandoned
       justadudewhohacks/face-api.js. Loaded lazily (only when a user opens the Face ID panel)
       via loadFaceApiModels() in the app script, not eagerly here, so a slow/blocked model CDN
       never delays the rest of the portal. Unlike the original package, this fork ships its
       model weights *inside* the published npm package itself, so jsDelivr/unpkg can serve both
       the library AND the model weights straight from npm (fast, versioned, CDN-cached) instead
       of proxying GitHub raw files — this is what was breaking Face ID sign-in before (the old
       GitHub-proxy weight mirror is slow/rate-limited/occasionally 404s). All face detection,
       landmarking and descriptor extraction still run entirely client-side in the browser — no
       image or biometric data ever leaves the device. A same-origin fallback CDN (unpkg) is
       swapped in automatically if the primary (jsDelivr) is blocked on this network. -->
  <script src="./vendor/face-api.js" defer data-runtime-key="face-api"></script>

    /* ===== GUARANTEED MOTION LAYER =========================================================
       The three utilities below (animate-float / animate-marquee / animate-pulse-slow) are
       normally generated on the fly by the Tailwind CDN script from the `tailwind.config`
       `extend.animation` block up in <head>. On some laptops/networks that dynamic style
       injection can lose the race with React's very first paint of the login/landing screen
       (the icons mount before Tailwind's JIT has scanned them), so the class name exists on
       the element but no matching CSS rule has been generated yet — the icon renders but never
       moves. Defining the exact same class names as plain, static CSS right here removes that
       race condition entirely: these rules are present the instant the stylesheet parses, long
       before Tailwind, React or Babel have even started loading, so every "animate-float" /
       "animate-marquee" / "animate-pulse-slow" element on the page is guaranteed to animate on
       every device, laptop or otherwise. (Tailwind may still generate its own copy later — an
       identical duplicate rule is harmless.) */
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .animate-float { animation: float 6s ease-in-out infinite; }
    @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    .animate-marquee { animation: marquee 25s linear infinite; }
    @keyframes pulse-slow-guaranteed { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .animate-pulse-slow { animation: pulse-slow-guaranteed 4s cubic-bezier(0.4,0,0.6,1) infinite; }

    /* ===== ADVANCED MOVING-ICON LIBRARY =====================================================
       A richer set of independent float/drift/orbit/wiggle loops (different amplitudes,
       durations and easing curves) so a cluster of icons feels alive and organic rather than
       every icon bobbing in robotic lock-step. Pure CSS, no JS, so it costs nothing at runtime
       and — like the block above — never depends on Tailwind's JIT finishing in time. */
    @keyframes icon-float-a { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(-6deg); } }
    @keyframes icon-float-b { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(5deg); } }
    @keyframes icon-float-c { 0%, 100% { transform: translate(0,0) rotate(0deg); } 33% { transform: translate(6px,-10px) rotate(4deg); } 66% { transform: translate(-6px,-4px) rotate(-4deg); } }
    @keyframes icon-drift { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(8px,-8px); } 50% { transform: translate(0,-14px); } 75% { transform: translate(-8px,-6px); } }
    @keyframes icon-spin-slow { to { transform: rotate(360deg); } }
    @keyframes icon-wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes icon-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .icon-float-a { animation: icon-float-a 5.5s ease-in-out infinite; }
    .icon-float-b { animation: icon-float-b 6.5s ease-in-out infinite; }
    .icon-float-c { animation: icon-float-c 8s ease-in-out infinite; }
    .icon-drift { animation: icon-drift 9s ease-in-out infinite; }
    .icon-spin-slow { animation: icon-spin-slow 7s linear infinite; }
    .icon-wiggle { animation: icon-wiggle 3.2s ease-in-out infinite; }
    .icon-pop { animation: icon-pop 2.4s ease-in-out infinite; }
    .anim-delay-1 { animation-delay: .4s; }
    .anim-delay-2 { animation-delay: .9s; }
    .anim-delay-3 { animation-delay: 1.5s; }
    .anim-delay-4 { animation-delay: 2.1s; }
    .anim-delay-5 { animation-delay: 2.8s; }

    /* ===== ADVANCED MOVING TEXT LIBRARY ======================================================
       "Shimmer" sweeps a soft light band across gradient headline text on a loop; "gradient
       move" slowly pans a multi-stop gradient through the text so the colour itself travels;
       "type-in" is a one-shot typewriter reveal for hero copy. Applied to the portal's key
       headlines/brand text (login hero, dashboard header, section titles) for a cohesive,
       premium, high-end motion feel without turning body copy into something unreadable. */
    @keyframes text-shimmer-sweep { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
    .text-shimmer {
      background-image: linear-gradient(110deg, currentColor 35%, #ffffff 50%, currentColor 65%);
      background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: text-shimmer-sweep 3.6s linear infinite;

            <p class="mt-1.5 text-xs text-slate-500">Secure access to your placement portal and all existing tools.</p>

            </div>

            </div>

  <!-- Minimal startup login handler. This is only a resilience layer: the full React login UI
       remains the source of truth and replaces this shell as soon as the application mounts.
       If a slow/failed React parse occurs, password login can still reach the existing backend. -->
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('cp-boot-login-form');
      if (!form) return;
      var email = document.getElementById('cp-boot-email');
      var password = document.getElementById('cp-boot-password');
      var button = document.getElementById('cp-boot-login-button');
      var error = document.getElementById('cp-boot-login-error');
      function apiBase() {
        try { return String(localStorage.getItem('AI_BACKEND_URL') || '').trim().replace(/\/+$/, ''); } catch (_) { return ''; }
      }
      function message(data, fallback) {
        return data && (data.error || (data.message && data.message.text) || data.message) || fallback;
      }
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var e = String(email.value || '').trim().toLowerCase();
        var p = String(password.value || '');
        error.classList.add('hidden');
        if (!e || !p) {
          error.textContent = 'Enter both your email and password.';
          error.classList.remove('hidden');
          return;
        }
        button.disabled = true;
        button.textContent = 'Signing in…';
        try {
          var controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 8000);
          var response;
          try {
            response = await fetch(apiBase() + '/api/portal-auth/login', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: e, password: p }),
              signal: controller.signal
            });
          } finally { clearTimeout(timeout); }
          var data = await response.json().catch(function () { return {}; });
          if (!response.ok || !data.user) throw new Error(message(data, 'Invalid email or password.'));
          var u = data.user;
          try {
            localStorage.setItem('CP_USER', JSON.stringify(u));
            localStorage.setItem('TNP_CURRENT_USER', JSON.stringify(Object.assign({}, u, { loggedIn: true })));
            localStorage.setItem('TNP_SESSION_META', JSON.stringify({ expiresAt: Date.now() + 12 * 60 * 60 * 1000, remembered: false }));
          } catch (_) {}
          window.location.reload();
        } catch (err) {
          error.textContent = err && err.name === 'AbortError'
            ? 'Sign-in timed out after 8 seconds. Please check the portal server and try again.'
            : (err && err.message ? err.message : 'Unable to sign in right now.');
          error.classList.remove('hidden');
          button.disabled = false;
          button.textContent = 'Sign In';
        }
      });
    })();
  </script>

  <!-- Unified React Application — precompiled to plain JS ahead of time (JSX -> React.createElement
       via a build step), NOT transpiled live in the browser. Previously this ~2.1MB of raw JSX was
       shipped as precompiled plain JavaScript rather than an in-browser JSX/Babel bundle. The browser
       executes the deferred same-origin runtime directly, with no client-side transform cost and
       no runtime dependency on Babel or its CDN. -->
  <!-- LeetCode-derived coding-practice question bank data, loaded as inert JSON (not JS)
       so the ~2500-problem payload never has to be parsed as a giant JS literal and can be
       fetched via JSON.parse() by the app script below (see LEETCODE_BANK). -->
  <!-- LeetCode bank is lazy-loaded from frontend/leetcode-bank.json to keep first paint fast. -->

  <!-- Cloud sync: mirrors per-student localStorage data to Neon and restores it after sign-in. Must load before the app. -->
  <script src="./cloud-sync.js"></script>

<script id="cps-phase1-accessibility-runtime">
(function(){
  'use strict';
  const install=()=>{
    if(document.getElementById('cps-skip-link')) return;
    const skip=document.createElement('a'); skip.id='cps-skip-link'; skip.className='cps-skip'; skip.href='#root'; skip.textContent='Skip to application';
    document.body.prepend(skip);
    /* Respect an OS dark preference before React paints its first interactive frame when the
       user has never explicitly chosen a theme. The existing TNP_DARK_MODE key remains untouched. */
    try{
      const saved=localStorage.getItem('TNP_DARK_MODE');
      if(saved===null && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark-mode');
    }catch(e){}
    /* Prevent accidental double-submit while an existing button is visibly busy. */
    document.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b || b.disabled) return;
      if(b.dataset.cpsOnce==='1') return;
      const busy=b.getAttribute('aria-busy')==='true';
      if(busy){e.preventDefault();e.stopPropagation();}
    },true);
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true}); else install();
})();
</script>
