services:
  - type: web
    name: campus-portal
    runtime: node
    # Prepare the FastAPI AI/ML runtime during the Render build, not on the first student request.
    # This removes the old 1–3 minute pip-install cold path that surfaced in the portal as request timeouts.
    buildCommand: python3 -m venv ai-ml-service/.venv && ai-ml-service/.venv/bin/python -m pip install --disable-pip-version-check -r ai-ml-service/requirements.txt && cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: AI_ML_AUTOINSTALL
        value: "false"
      - key: AI_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: AI_ML_PROXY_TIMEOUT_MS
        value: "50000"
    autoDeployTrigger: commit
